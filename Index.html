  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    // appifacts: only on tags now pointing at OUR blob: URLs. A reference the
    // bundler left live-fetched (an absolute x-import, a runtime dependency it
    // could not embed, an authored external script) keeps the pin it was
    // written with: that fetch is exactly what SRI protects. (A crossorigin
    // on a parent whose child carries the blob — <video crossorigin><source>
    // — is left alone too; the attribute is then the author's to drop.)
    template = template.replace(/<[a-z][^>]*>/gi, (tag) => /\s(?:src|href|srcset|poster|data|xlink:href)="blob:/i.test(tag) ? tag.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '') : tag);

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry

height: 1.6\" data-canvas-width=\"1280\" data-canvas-height=\"2600\">\n\n<!-- Nav -->\n<header style=\"max-width: 1200px; margin: 0 auto; padding: 20px 24px; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<a href=\"#top\" style=\"font-family: 'Pacifico', cursive; font-size: 26px; color: {{accent}}; text-decoration: none\">Billy Metz Show<\u002Fa>\n<nav aria-label=\"Main\" style=\"display: flex; flex-wrap: wrap; gap: 8px\">\n<a href=\"#episodes\" style=\"padding: 10px 16px; font-weight: 700; text-decoration: none\">Episodes<\u002Fa>\n<a href=\"#about\" style=\"padding: 10px 16px; font-weight: 700; text-decoration: none\">About<\u002Fa>\n<a href=\"#listen\" style=\"padding: 10px 20px; font-weight: 800; text-decoration: none; background: #0F2350; color: #FBF0D9; border-radius: 999px\">Listen now<\u002Fa>\n<\u002Fnav>\n<\u002Fheader>\n\n<!-- Hero -->\n<section id=\"top\" style=\"max-width: 1200px; margin: 0 auto; padding: 24px 24px 64px; display: flex; flex-wrap: wrap; align-items: center; gap: 48px\">\n<div style=\"flex: 1 1 320px; display: flex; justify-content: center\">\n<div style=\"position: relative; width: 100%; max-width: 440px\">\n<img src=\"e3cedeb0-004d-4a24-8ad2-c9e548702a51\" alt=\"Illustrated portrait of Billy Metz smiling\" style=\"display: block; width: 100%; height: auto; border-radius: 50% 50% 46% 54% / 52% 48% 52% 48%; border: 4px solid #0F2350; box-shadow: 10px 10px 0 #0F2350\">\n<span style=\"position: absolute; right: -8px; bottom: 28px; transform: rotate(-8deg); background: #1F6B6A; color: #FFFFFF; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.12em; text-transform: uppercase; padding: 10px 18px; border-radius: 999px; border: 3px solid #0F2350\">New every week<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.3em; text-transform: uppercase; color: #0F2350\">Sales · Emotions · Faith<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(56px, 9vw, 104px); line-height: 1.1; color: {{accent}}; text-shadow: 3px 3px 0 #0F2350\">Billy Metz Show<\u002Fh1>\n<p style=\"margin: 0; font-family: 'Pacifico', cursive; font-size: clamp(28px, 4vw, 40px); line-height: 1.3; color: #1F6B6A\">Sell With Dignity<\u002Fp>\n<p style=\"margin: 0; max-width: 34em; font-size: 20px\">Real talk for salespeople about closing deals, handling the emotional rollercoaster, and keeping your faith at the center of it all.<\u002Fp>\n<div id=\"listen\" style=\"display: flex; flex-wrap: wrap; gap: 12px; padding-top: 8px\">\n<a href=\"#\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; background: #0F2350; color: #FBF0D9; font-weight: 800; text-decoration: none; border-radius: 999px; border: 3px solid #0F2350\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"11\" r=\"3\"><\u002Fcircle><path d=\"M12 14v7\"><\u002Fpath><path d=\"M6.5 16.5a8 8 0 1 1 11 0\"><\u002Fpath><\u002Fsvg>Apple Podcasts<\u002Fa>\n<a href=\"#\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; background: #FFFFFF; color: #0F2350; font-weight: 800; text-decoration: none; border-radius: 999px; border: 3px solid #0F2350\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M7 9.5c3.5-1 7.5-.6 10.5 1\"><\u002Fpath><path d=\"M7.5 13c3-.8 6-.4 8.5.9\"><\u002Fpath><path d=\"M8 16.3c2.4-.6 4.6-.3 6.6.7\"><\u002Fpath><\u002Fsvg>Spotify<\u002Fa>\n<a href=\"#\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; background: #FFFFFF; color: #0F2350; font-weight: 800; text-decoration: none; border-radius: 999px; border: 3px solid #0F2350\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" sc-camel-view-box=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"4\"><\u002Frect><path d=\"M10 9l5 3-5 3z\"><\u002Fpath><\u002Fsvg>YouTube<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Pillars -->\n<section style=\"background: #0F2350; color: #FBF0D9; padding: 72px 24px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<h2 style=\"margin: 0; text-align: center; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(36px, 5vw, 52px); color: #FBF0D9\">What we talk about<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 260px; background: #FBF0D9; color: #0F2350; border-radius: 24px; padding: 32px; transform: rotate(-1.5deg); box-shadow: 8px 8px 0 #5AA9E0\">\n<h3 style=\"margin: 0 0 8px; font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase\">Sales<\u002Fh3>\n<p style=\"margin: 0\">Prospecting, objections and closing without losing who you are. Selling that serves people instead of pushing them.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; background: #FBF0D9; color: #0F2350; border-radius: 24px; padding: 32px; transform: rotate(1deg); box-shadow: 8px 8px 0 #5AA9E0\">\n<h3 style=\"margin: 0 0 8px; font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase\">Emotions<\u002Fh3>\n<p style=\"margin: 0\">Rejection, burnout, the highs and the lows. Honest conversations about the inner game every seller plays.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; background: #FBF0D9; color: #0F2350; border-radius: 24px; padding: 32px; transform: rotate(-0.5deg); box-shadow: 8px 8px 0 #5AA9E0\">\n<h3 style=\"margin: 0 0 8px; font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase\">Faith<\u002Fh3>\n<p style=\"margin: 0\">Bringing your faith to work. Purpose, integrity and trust when the quota feels heavy.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 16px\">\n<p style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.25em; text-transform: uppercase; color: #FBF0D9\">…and a whole lot more<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 960px\">\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #5AA9E0; color: #0F2350; font-weight: 800; transform: rotate(-2deg)\">Cuban cigars<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #FBF0D9; color: #0F2350; font-weight: 800; transform: rotate(1.5deg)\">Emotional regulation<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #1F6B6A; color: #FFFFFF; font-weight: 800; border: 2px solid #FBF0D9; transform: rotate(-1deg)\">Suppressing your emotions<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #FBF0D9; color: #0F2350; font-weight: 800; transform: rotate(2deg)\">Faith<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #5AA9E0; color: #0F2350; font-weight: 800; transform: rotate(-1.5deg)\">War movies<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #1F6B6A; color: #FFFFFF; font-weight: 800; border: 2px solid #FBF0D9; transform: rotate(1deg)\">The cultures salespeople live in<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #FBF0D9; color: #0F2350; font-weight: 800; transform: rotate(-2.5deg)\">Mr. Coffee vs. Nespresso<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Episodes -->\n<section id=\"episodes\" style=\"max-width: 1200px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px\">\n<h2 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(36px, 5vw, 52px); color: #0F2350\">Latest episodes<\u002Fh2>\n<a href=\"#\" style=\"font-weight: 800\">See all episodes →<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<sc-for list=\"{{episodes}}\" as=\"ep\" hint-placeholder-count=\"3\">\n<article style=\"flex: 1 1 300px; background: #FFFFFF; border: 3px solid #0F2350; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"align-self: flex-start; font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; background: #E3F0FA; color: #0F2350; padding: 6px 12px; border-radius: 999px\">{{ep.tag}}<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3\">{{ep.title}}<\u002Fh3>\n<p style=\"margin: 0; color: #3A4A6B\">{{ep.blurb}}<\u002Fp>\n<a href=\"#\" style=\"margin-top: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 800; color: #1F6B6A\">\n<svg aria-hidden=\"true\" width=\"22\" height=\"22\" sc-camel-view-box=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg>Play episode<\u002Fa>\n<\u002Farticle>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- About -->\n<section id=\"about\" style=\"background: #F3E2BF; padding: 80px 24px\">\n<div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 40px\">\n<div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(36px, 5vw, 52px); color: #0F2350\">About Billy<\u002Fh2>\n<p style=\"margin: 0\">At 22, in his very first sales job, Billy Metz achieved a 92% retention rate in an industry where 50% or lower was the norm.<\u002Fp>\n<p style=\"margin: 0\">Since then he has sold just about everything: tech, B2B, B2C, B2B2C, financial services, and even fundraising for prisoners. He has worked million-dollar deals and $300 sales and everything in between, and he knows sales cycles inside and out. He also created and developed his own app.<\u002Fp>\n<p style=\"margin: 0\">Before sales, there was the stage. Billy earned a BA in theater arts from Rollins College, a degree in film from Artsake Academy in Orlando, and trained at the Gaiety School of Acting in Ireland. He believes that training is his greatest asset: it built the communication skills and resilience that have carried him through everything since.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 0 1 320px; background: #0F2350; color: #FBF0D9; border-radius: 28px; padding: 32px; transform: rotate(-2deg); box-shadow: 10px 10px 0 #5AA9E0; text-align: center\">\n<p style=\"margin: 0; font-family: 'Pacifico', cursive; font-size: 88px; line-height: 1.1; color: #5AA9E0\">92%<\u002Fp>\n<p style=\"margin: 8px 0 0; font-weight: 700\">retention rate at age 22, in an industry averaging 50% or lower<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 340px; background: #FBF0D9; border: 3px solid #0F2350; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase\">The framework<\u002Fh3>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"padding: 8px 18px; border-radius: 999px; background: #0F2350; color: #FBF0D9; font-weight: 800\">Notice<\u002Fspan>\n<span style=\"padding: 8px 18px; border-radius: 999px; background: #1F6B6A; color: #FFFFFF; font-weight: 800\">Name<\u002Fspan>\n<span style=\"padding: 8px 18px; border-radius: 999px; background: #5AA9E0; color: #0F2350; font-weight: 800\">Navigate<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0; font-family: 'Pacifico', cursive; font-size: 28px; color: #1F6B6A\">IQ + EQ = Competence<\u002Fp>\n<p style=\"margin: 0\">Billy used this framework to combine smarts with emotional intelligence, and he performed at the top of every organization he joined.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px; background: #FFFFFF; border: 3px dashed #1F6B6A; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase\">The other side<\u002Fh3>\n<p style=\"margin: 0\">Success came with burnout. When Billy buried his faith and buried his emotions, he felt the repercussions. He has lived both sides, and that is exactly why he started this show.<\u002Fp>\n<p style=\"margin: 0\">Every week, he gets honest about the behaviors that no longer serve salespeople, and what to do instead.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #1F6B6A; color: #FFFFFF; border-radius: 28px; padding: 40px 32px; text-align: center; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.25em; text-transform: uppercase\">The mission<\u002Fp>\n<p style=\"margin: 0 auto; max-width: 40em; font-size: 22px; font-weight: 700; line-height: 1.5\">Help people sell with dignity, wake up every day knowing their worth is not tied to the number, and do it all for the glory of God, without burying their emotions.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<!-- Subscribe -->\n<section style=\"max-width: 760px; margin: 0 auto; padding: 80px 24px; text-align: center; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(32px, 4.5vw, 46px); color: {{accent}}; text-shadow: 2px 2px 0 #0F2350\">Never miss an episode<\u002Fh2>\n<p style=\"margin: 0\">Get new episodes and a short weekly note straight to your inbox.<\u002Fp>\n<form style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-top: 8px\">\n<label for=\"email\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Email address<\u002Flabel>\n<input id=\"email\" type=\"email\" placeholder=\"you@example.com\" style=\"flex: 1 1 260px; max-width: 360px; min-height: 52px; box-sizing: border-box; padding: 0 20px; font: inherit; color: #0F2350; background: #FFFFFF; border: 3px solid #0F2350; border-radius: 999px\">\n<button type=\"submit\" style=\"min-height: 52px; padding: 0 28px; font: inherit; font-weight: 800; color: #FBF0D9; background: #1F6B6A; border: 3px solid #0F2350; border-radius: 999px; cursor: pointer\">Subscribe<\u002Fbutton>\n<\u002Fform>\n<\u002Fsection>\n\n<!-- Footer -->\n<footer style=\"background: #0F2350; color: #FBF0D9; padding: 40px 24px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<span style=\"font-family: 'Pacifico', cursive; font-size: 24px\">Sell With Dignity<\u002Fspan>\n<span style=\"font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase\">Sales · Emotions · Faith<\u002Fspan>\n<span style=\"font-size: 15px\">© 2026 Billy Metz Show<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<sc-if data-dc-static=\"\" value=\"{{ false }}\"><style>x-dc>*{display:none!important}x-dc>[data-dc-static]{display:block!important}<\u002Fst yle=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 20px\">\n<p style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.3em; text-transform: uppercase; color: #0F2350\">Sales · Emotions · Faith<\u002Fp>\n<h1 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(56px, 9vw, 104px); line-height: 1.1; color: #5AA9E0; text-shadow: 3px 3px 0 #0F2350\">Billy Metz Show<\u002Fh1>\n<p style=\"margin: 0; font-family: 'Pacifico', cursive; font-size: clamp(28px, 4vw, 40px); line-height: 1.3; color: #1F6B6A\">Sell With Dignity<\u002Fp>\n<p style=\"margin: 0; max-width: 34em; font-size: 20px\">Real talk for salespeople about closing deals, handling the emotional rollercoaster, and keeping your faith at the center of it all.<\u002Fp>\n<div id=\"listen\" style=\"display: flex; flex-wrap: wrap; gap: 12px; padding-top: 8px\">\n<a href=\"#\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; background: #0F2350; color: #FBF0D9; font-weight: 800; text-decoration: none; border-radius: 999px; border: 3px solid #0F2350\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"11\" r=\"3\"><\u002Fcircle><path d=\"M12 14v7\"><\u002Fpath><path d=\"M6.5 16.5a8 8 0 1 1 11 0\"><\u002Fpath><\u002Fsvg>Apple Podcasts<\u002Fa>\n<a href=\"#\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; background: #FFFFFF; color: #0F2350; font-weight: 800; text-decoration: none; border-radius: 999px; border: 3px solid #0F2350\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M7 9.5c3.5-1 7.5-.6 10.5 1\"><\u002Fpath><path d=\"M7.5 13c3-.8 6-.4 8.5.9\"><\u002Fpath><path d=\"M8 16.3c2.4-.6 4.6-.3 6.6.7\"><\u002Fpath><\u002Fsvg>Spotify<\u002Fa>\n<a href=\"#\" style=\"display: inline-flex; align-items: center; gap: 10px; min-height: 48px; padding: 0 22px; background: #FFFFFF; color: #0F2350; font-weight: 800; text-decoration: none; border-radius: 999px; border: 3px solid #0F2350\">\n<svg aria-hidden=\"true\" width=\"20\" height=\"20\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linejoin=\"round\"><rect x=\"2\" y=\"5\" width=\"20\" height=\"14\" rx=\"4\"><\u002Frect><path d=\"M10 9l5 3-5 3z\"><\u002Fpath><\u002Fsvg>YouTube<\u002Fa>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"background: #0F2350; color: #FBF0D9; padding: 72px 24px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-direction: column; gap: 40px\">\n<h2 style=\"margin: 0; text-align: center; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(36px, 5vw, 52px); color: #FBF0D9\">What we talk about<\u002Fh2>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 260px; background: #FBF0D9; color: #0F2350; border-radius: 24px; padding: 32px; transform: rotate(-1.5deg); box-shadow: 8px 8px 0 #5AA9E0\">\n<h3 style=\"margin: 0 0 8px; font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase\">Sales<\u002Fh3>\n<p style=\"margin: 0\">Prospecting, objections and closing without losing who you are. Selling that serves people instead of pushing them.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; background: #FBF0D9; color: #0F2350; border-radius: 24px; padding: 32px; transform: rotate(1deg); box-shadow: 8px 8px 0 #5AA9E0\">\n<h3 style=\"margin: 0 0 8px; font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase\">Emotions<\u002Fh3>\n<p style=\"margin: 0\">Rejection, burnout, the highs and the lows. Honest conversations about the inner game every seller plays.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 260px; background: #FBF0D9; color: #0F2350; border-radius: 24px; padding: 32px; transform: rotate(-0.5deg); box-shadow: 8px 8px 0 #5AA9E0\">\n<h3 style=\"margin: 0 0 8px; font-family: 'Oswald', sans-serif; font-size: 28px; letter-spacing: 0.08em; text-transform: uppercase\">Faith<\u002Fh3>\n<p style=\"margin: 0\">Bringing your faith to work. Purpose, integrity and trust when the quota feels heavy.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"display: flex; flex-direction: column; align-items: center; gap: 20px; padding-top: 16px\">\n<p style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.25em; text-transform: uppercase; color: #FBF0D9\">…and a whole lot more<\u002Fp>\n<ul style=\"list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; justify-content: center; gap: 14px; max-width: 960px\">\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #5AA9E0; color: #0F2350; font-weight: 800; transform: rotate(-2deg)\">Cuban cigars<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #FBF0D9; color: #0F2350; font-weight: 800; transform: rotate(1.5deg)\">Emotional regulation<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #1F6B6A; color: #FFFFFF; font-weight: 800; border: 2px solid #FBF0D9; transform: rotate(-1deg)\">Suppressing your emotions<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #FBF0D9; color: #0F2350; font-weight: 800; transform: rotate(2deg)\">Faith<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #5AA9E0; color: #0F2350; font-weight: 800; transform: rotate(-1.5deg)\">War movies<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #1F6B6A; color: #FFFFFF; font-weight: 800; border: 2px solid #FBF0D9; transform: rotate(1deg)\">The cultures salespeople live in<\u002Fli>\n<li style=\"padding: 10px 20px; border-radius: 999px; background: #FBF0D9; color: #0F2350; font-weight: 800; transform: rotate(-2.5deg)\">Mr. Coffee vs. Nespresso<\u002Fli>\n<\u002Ful>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"episodes\" style=\"max-width: 1200px; margin: 0 auto; padding: 80px 24px; display: flex; flex-direction: column; gap: 32px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 12px\">\n<h2 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(36px, 5vw, 52px); color: #0F2350\">Latest episodes<\u002Fh2>\n<a href=\"#\" style=\"font-weight: 800\">See all episodes →<\u002Fa>\n<\u002Fdiv>\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n\n<article style=\"flex: 1 1 300px; background: #FFFFFF; border: 3px solid #0F2350; border-radius: 20px; padding: 28px; display: flex; flex-direction: column; gap: 12px\">\n<span style=\"align-self: flex-start; font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.14em; text-transform: uppercase; background: #E3F0FA; color: #0F2350; padding: 6px 12px; border-radius: 999px\">{{ep.tag}}<\u002Fspan>\n<h3 style=\"margin: 0; font-size: 22px; font-weight: 800; line-height: 1.3\">{{ep.title}}<\u002Fh3>\n<p style=\"margin: 0; color: #3A4A6B\">{{ep.blurb}}<\u002Fp>\n<a href=\"#\" style=\"margin-top: auto; display: inline-flex; align-items: center; gap: 8px; min-height: 44px; font-weight: 800; color: #1F6B6A\">\n<svg aria-hidden=\"true\" width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"currentColor\"><path d=\"M8 5v14l11-7z\"><\u002Fpath><\u002Fsvg>Play episode<\u002Fa>\n<\u002Farticle>\n\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section id=\"about\" style=\"background: #F3E2BF; padding: 80px 24px\">\n<div style=\"max-width: 1100px; margin: 0 auto; display: flex; flex-direction: column; gap: 48px\">\n<div style=\"display: flex; flex-wrap: wrap; align-items: center; gap: 40px\">\n<div style=\"flex: 1 1 420px; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(36px, 5vw, 52px); color: #0F2350\">About Billy<\u002Fh2>\n<p style=\"margin: 0\">At 22, in his very first sales job, Billy Metz achieved a 92% retention rate in an industry where 50% or lower was the norm.<\u002Fp>\n<p style=\"margin: 0\">Since then he has sold just about everything: tech, B2B, B2C, B2B2C, financial services, and even fundraising for prisoners. He has worked million-dollar deals and $300 sales and everything in between, and he knows sales cycles inside and out. He also created and developed his own app.<\u002Fp>\n<p style=\"margin: 0\">Before sales, there was the stage. Billy earned a BA in theater arts from Rollins College, a degree in film from Artsake Academy in Orlando, and trained at the Gaiety School of Acting in Ireland. He believes that training is his greatest asset: it built the communication skills and resilience that have carried him through everything since.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 0 1 320px; background: #0F2350; color: #FBF0D9; border-radius: 28px; padding: 32px; transform: rotate(-2deg); box-shadow: 10px 10px 0 #5AA9E0; text-align: center\">\n<p style=\"margin: 0; font-family: 'Pacifico', cursive; font-size: 88px; line-height: 1.1; color: #5AA9E0\">92%<\u002Fp>\n<p style=\"margin: 8px 0 0; font-weight: 700\">retention rate at age 22, in an industry averaging 50% or lower<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"display: flex; flex-wrap: wrap; gap: 24px\">\n<div style=\"flex: 1 1 340px; background: #FBF0D9; border: 3px solid #0F2350; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase\">The framework<\u002Fh3>\n<div style=\"display: flex; flex-wrap: wrap; gap: 10px\">\n<span style=\"padding: 8px 18px; border-radius: 999px; background: #0F2350; color: #FBF0D9; font-weight: 800\">Notice<\u002Fspan>\n<span style=\"padding: 8px 18px; border-radius: 999px; background: #1F6B6A; color: #FFFFFF; font-weight: 800\">Name<\u002Fspan>\n<span style=\"padding: 8px 18px; border-radius: 999px; background: #5AA9E0; color: #0F2350; font-weight: 800\">Navigate<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin: 0; font-family: 'Pacifico', cursive; font-size: 28px; color: #1F6B6A\">IQ + EQ = Competence<\u002Fp>\n<p style=\"margin: 0\">Billy used this framework to combine smarts with emotional intelligence, and he performed at the top of every organization he joined.<\u002Fp>\n<\u002Fdiv>\n<div style=\"flex: 1 1 340px; background: #FFFFFF; border: 3px dashed #1F6B6A; border-radius: 24px; padding: 32px; display: flex; flex-direction: column; gap: 16px\">\n<h3 style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 24px; letter-spacing: 0.1em; text-transform: uppercase\">The other side<\u002Fh3>\n<p style=\"margin: 0\">Success came with burnout. When Billy buried his faith and buried his emotions, he felt the repercussions. He has lived both sides, and that is exactly why he started this show.<\u002Fp>\n<p style=\"margin: 0\">Every week, he gets honest about the behaviors that no longer serve salespeople, and what to do instead.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"background: #1F6B6A; color: #FFFFFF; border-radius: 28px; padding: 40px 32px; text-align: center; display: flex; flex-direction: column; gap: 12px\">\n<p style=\"margin: 0; font-family: 'Oswald', sans-serif; font-size: 16px; letter-spacing: 0.25em; text-transform: uppercase\">The mission<\u002Fp>\n<p style=\"margin: 0 auto; max-width: 40em; font-size: 22px; font-weight: 700; line-height: 1.5\">Help people sell with dignity, wake up every day knowing their worth is not tied to the number, and do it all for the glory of God, without burying their emotions.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n\n<section style=\"max-width: 760px; margin: 0 auto; padding: 80px 24px; text-align: center; display: flex; flex-direction: column; gap: 16px\">\n<h2 style=\"margin: 0; font-family: 'Pacifico', cursive; font-weight: 400; font-size: clamp(32px, 4.5vw, 46px); color: #5AA9E0; text-shadow: 2px 2px 0 #0F2350\">Never miss an episode<\u002Fh2>\n<p style=\"margin: 0\">Get new episodes and a short weekly note straight to your inbox.<\u002Fp>\n<form style=\"display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; padding-top: 8px\">\n<label for=\"email\" style=\"position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)\">Email address<\u002Flabel>\n<input id=\"email\" type=\"email\" placeholder=\"you@example.com\" style=\"flex: 1 1 260px; max-width: 360px; min-height: 52px; box-sizing: border-box; padding: 0 20px; font: inherit; color: #0F2350; background: #FFFFFF; border: 3px solid #0F2350; border-radius: 999px\">\n<button type=\"submit\" style=\"min-height: 52px; padding: 0 28px; font: inherit; font-weight: 800; color: #FBF0D9; background: #1F6B6A; border: 3px solid #0F2350; border-radius: 999px; cursor: pointer\">Subscribe<\u002Fbutton>\n<\u002Fform>\n<\u002Fsection>\n\n\n<footer style=\"background: #0F2350; color: #FBF0D9; padding: 40px 24px\">\n<div style=\"max-width: 1200px; margin: 0 auto; display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between; gap: 16px\">\n<span style=\"font-family: 'Pacifico', cursive; font-size: 24px\">Sell With Dignity<\u002Fspan>\n<span style=\"font-family: 'Oswald', sans-serif; font-size: 14px; letter-spacing: 0.2em; text-transform: uppercase\">Sales · Emotions · Faith<\u002Fspan>\n<span style=\"font-size: 15px\">© 2026 Billy Metz Show<\u002Fspan>\n<\u002Fdiv>\n<\u002Ffooter>\n\n<\u002Fdiv>\n<\u002Fsc-if><\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#5AA9E0&q
